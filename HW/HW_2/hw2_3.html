<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        .head{
            background-color: #356AB5;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: white;
            font-size: 50px;
        }

        .widgets{
            height: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .box{
            background-color: #224576;
            height: 90%;
            width: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
        }

        .contact{
            background-color: #356AB5;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
        }
    </style>
</head>
<body>
<div class="head"><span>Widgets</span></div>
<div class="widgets">
    <div class="box"><span>Big Widgets</span></div>
    <div class="box"><span>Bigger Widgets</span></div>
    <div class="box"><span></span>Huge Widgets</div>
</div>
<div class="contact"><span>Contact</span></div>
</body>
</html>
